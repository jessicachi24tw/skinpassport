<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5"/></marker>
  </defs>
  <rect width="900" height="640" fill="#ffffff"/>
  <!-- Frontend -->
  <rect x="40" y="30" width="820" height="170" rx="18" fill="#eeedfe" stroke="#534ab7"/>
  <text x="64" y="62" font-size="17" font-weight="600" fill="#3c3489">FRONTEND — Next.js mobile web (browser)</text>
  <text x="64" y="84" font-size="13" fill="#534ab7">React UI · no API keys in the browser</text>
  <g font-size="15" text-anchor="middle">
    <rect x="70" y="110" width="220" height="64" rx="10" fill="#fff" stroke="#888780"/><text x="180" y="138" font-weight="600" fill="#2c2c2a">1. Skin scan</text><text x="180" y="158" font-size="12" fill="#5f5e5a">In-app camera or upload</text>
    <rect x="340" y="110" width="220" height="64" rx="10" fill="#fff" stroke="#888780"/><text x="450" y="138" font-weight="600" fill="#2c2c2a">2. Trip planner</text><text x="450" y="158" font-size="12" fill="#5f5e5a">From/To autocomplete + flight map</text>
    <rect x="610" y="110" width="220" height="64" rx="10" fill="#fff" stroke="#888780"/><text x="720" y="138" font-weight="600" fill="#2c2c2a">3. Results</text><text x="720" y="158" font-size="12" fill="#5f5e5a">Plan, kits, product pages, bag</text>
  </g>
  <line x1="450" y1="202" x2="450" y2="258" stroke="#5f5e5a" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="462" y="236" font-size="13" fill="#5f5e5a">HTTPS JSON  /api/*</text>
  <!-- Backend -->
  <rect x="40" y="260" width="820" height="200" rx="18" fill="#e1f5ee" stroke="#0f6e56"/>
  <text x="64" y="292" font-size="17" font-weight="600" fill="#085041">BACKEND — Next.js API routes (server)</text>
  <text x="64" y="314" font-size="13" fill="#0f6e56">Holds all API keys · demo/mock fallbacks for every integration</text>
  <g font-size="15" text-anchor="middle">
    <rect x="70" y="340" width="220" height="90" rx="10" fill="#fff" stroke="#888780"/><text x="180" y="368" font-weight="600" fill="#2c2c2a">/api/skin/*</text><text x="180" y="390" font-size="12" fill="#5f5e5a">Register file → upload →</text><text x="180" y="406" font-size="12" fill="#5f5e5a">create task → poll status</text>
    <rect x="340" y="340" width="220" height="90" rx="10" fill="#fff" stroke="#e0674f" stroke-width="2"/><text x="450" y="368" font-weight="600" fill="#2c2c2a">/api/plan — Advice engine</text><text x="450" y="390" font-size="12" fill="#5f5e5a">Rule engine → Necessity Score</text><text x="450" y="406" font-size="12" fill="#5f5e5a">Essential + Complete kits</text>
    <rect x="610" y="340" width="220" height="90" rx="10" fill="#fff" stroke="#888780"/><text x="720" y="368" font-weight="600" fill="#2c2c2a">/api/weather · /api/places</text><text x="720" y="390" font-size="12" fill="#5f5e5a">Trip forecast + home climate</text><text x="720" y="406" font-size="12" fill="#5f5e5a">Temp · humidity · UV · AQI</text>
  </g>
  <line x1="292" y1="385" x2="336" y2="385" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="608" y1="385" x2="564" y2="385" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#a)"/>
  <!-- External -->
  <g font-size="15" text-anchor="middle">
    <rect x="70" y="520" width="220" height="64" rx="10" fill="#faeeda" stroke="#854f0b"/><text x="180" y="548" font-weight="600" fill="#633806">YouCam AI Skin Analysis</text><text x="180" y="568" font-size="12" fill="#854f0b">moisture, oiliness, redness, spots…</text>
    <rect x="330" y="520" width="115" height="64" rx="10" fill="#faeeda" stroke="#854f0b"/><text x="387" y="548" font-weight="600" fill="#633806">Claude LLM</text><text x="387" y="568" font-size="12" fill="#854f0b">coach note</text>
    <rect x="455" y="520" width="115" height="64" rx="10" fill="#faeeda" stroke="#854f0b"/><text x="512" y="548" font-weight="600" fill="#633806">Shop provider</text><text x="512" y="568" font-size="12" fill="#854f0b">catalog → retailer</text>
    <rect x="610" y="520" width="220" height="64" rx="10" fill="#faeeda" stroke="#854f0b"/><text x="720" y="548" font-weight="600" fill="#633806">Open-Meteo / OpenWeather</text><text x="720" y="568" font-size="12" fill="#854f0b">forecast + air quality</text>
  </g>
  <line x1="180" y1="432" x2="180" y2="516" stroke="#5f5e5a" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="400" y1="432" x2="400" y2="516" stroke="#5f5e5a" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="505" y1="432" x2="505" y2="516" stroke="#5f5e5a" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="720" y1="432" x2="720" y2="516" stroke="#5f5e5a" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="40" y="620" font-size="12" fill="#5f5e5a">Purple = browser · Green = your server · Amber = third-party APIs. The rule engine decides WHAT to recommend; the LLM only explains it.</text>
</svg>
